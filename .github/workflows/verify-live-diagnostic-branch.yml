name: Verificar diagnóstico ao vivo da branch

on:
  push:
    branches: [harden-live-browser-diagnostic]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar e testar
        run: |
          npm run build
          node --test tests/*.test.mjs

      - name: Diagnosticar endereço publicado
        run: npm run diagnose:live
        env:
          DIAGNOSTIC_URL: https://beta-gestao-365.scolarisamuel.workers.dev
          DIAGNOSTIC_WAIT_MS: "45000"

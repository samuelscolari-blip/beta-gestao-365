name: Aplicar Dashboard da Obra V56

on:
  push:
    branches:
      - corrigir-cores-execucao-v55
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-build-test:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'Aplicar dashboard executivo V56'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar branch de correção
        uses: actions/checkout@v4
        with:
          ref: corrigir-cores-execucao-v55
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Corrigir conferência do transformador
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-construction-v56.py")
          source = path.read_text(encoding="utf-8")
          old = 'if updated.count("construction-dashboard-v56") != 2:'
          new = 'if updated.count("construction-dashboard-v56") != 1:'
          if old not in source:
              raise RuntimeError("A conferência antiga não foi encontrada.")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Validar e aplicar transformação
        run: |
          python -m py_compile scripts/apply-construction-v56.py
          python scripts/apply-construction-v56.py
          test -f app/construction-v56.css
          grep -q 'construction-dashboard-v56' app/components/BetaApp.tsx
          grep -q 'construction-v56.css' app/layout.tsx
          ! grep -q 'construction-v55.css' app/layout.tsx

      - name: Instalar dependências
        run: npm ci

      - name: Compilar versão Cloudflare
        run: npm run build

      - name: Executar todos os testes
        run: node --test tests/*.test.mjs

      - name: Gravar código aprovado
        run: |
          git config user.name "samuelscolari-blip"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/BetaApp.tsx app/layout.tsx app/construction-v56.css app/construction-v55.css scripts/apply-construction-v56.py
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nova para gravar."
          else
            git commit -m "Aplicar dashboard executivo V56"
            git push origin HEAD:corrigir-cores-execucao-v55
          fi

name: Publicar no Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-gestao-365-production-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://beta-gestao-365.scolarisamuel.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Baixar exatamente a revisão a publicar
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Confirmar credenciais e revisão
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TARGET_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Preparar título da implantação
        shell: bash
        run: |
          deploy_message="$(git log -1 --pretty=%s | tr '\r\n' ' ' | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//' | cut -c1-120)"
          if [ -z "$deploy_message" ]; then
            deploy_message="Beta Gestão 365 ${TARGET_SHA:0:12}"
          fi
          echo "DEPLOY_MESSAGE=$deploy_message" >> "$GITHUB_ENV"
          echo "Descrição Cloudflare: $deploy_message"

      - name: Instalar dependências travadas
        run: npm ci

      - name: Verificar qualidade do código
        run: npm run lint

      - name: Registrar identidade da implantação
        shell: bash
        run: |
          mkdir -p public
          {
            echo "Beta Gestão 365"
            echo "environment=production"
            echo "commit=$TARGET_SHA"
            echo "message=$DEPLOY_MESSAGE"
            echo "event=${{ github.event_name }}"
            echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } > public/deployment-version.txt

      - name: Compilar e executar testes
        run: npm test

      - name: Reconhecer histórico do D1 já existente
        run: node scripts/adopt-d1-migration-history.mjs

      - name: Aplicar migrations aditivas no D1
        run: npm run db:migrate:remote

      - name: Publicar o Worker de produção
        shell: bash
        run: |
          test -f dist/server/wrangler.json
          npx wrangler deploy \
            --config dist/server/wrangler.json \
            --message "$DEPLOY_MESSAGE"

      # A janela era de 40s (8 tentativas de 5s) e não bastou: a publicação
      # da PR #117 gastou os 40s inteiros e falhou aqui, com o passo
      # anterior — "Publicar o Worker de produção" — em verde. A propagação
      # até a borda simplesmente demora mais do que isso às vezes.
      #
      # Agora são 24 tentativas: 2 minutos. Continua falhando se o commit
      # publicado for OUTRO, que é o defeito real que este passo existe
      # para pegar; o que muda é só parar de chamar de defeito o tempo
      # normal de propagação.
      #
      # O último valor lido é impresso no erro. Sem isso a mensagem dizia
      # apenas que o commit não era o esperado, sem dizer qual era — que é
      # justamente o dado que separa "ainda propagando" de "publicou a
      # revisão errada".
      - name: Confirmar o commit exato publicado
        shell: bash
        run: |
          expected="commit=$TARGET_SHA"
          marker=""
          for attempt in $(seq 1 24); do
            #
            # A query única e o cabeçalho de revalidação existem porque a
            # janela anterior, de 2 minutos, foi consumida INTEIRA (122s
            # medidos) recebendo sempre o mesmo valor antigo. Propagação
            # gradual não se comporta assim: alguma das 24 tentativas teria
            # acertado. Receber o valor velho 24 vezes seguidas é cache.
            #
            # O arquivo é gerado antes do build e empacotado junto, então o
            # Worker publicado serve o valor certo — quem estava guardando
            # o antigo era a borda, que trata o .txt como asset estático.
            #
            marker="$(curl --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              "https://beta-gestao-365.scolarisamuel.workers.dev/deployment-version.txt?cache_bust=${GITHUB_RUN_ID}-${attempt}" || true)"
            if grep --fixed-strings --quiet "$expected" <<< "$marker"; then
              echo "$marker"
              exit 0
            fi
            sleep 5
          done
          echo "A Cloudflare respondeu, mas não publicou o commit esperado: $TARGET_SHA" >&2
          echo "Último valor lido em /deployment-version.txt: ${marker:-(vazio)}" >&2
          exit 1

      # DUAS TENTATIVAS, e não uma espera ainda maior.
      #
      # Esta verificação já falhou três vezes por tempo: com 45s (PRs #113,
      # #114 e #115) e com 90s (PR #128, que estourou em 98 segundos). Nas
      # quatro, o Worker tinha sido publicado — os passos anteriores
      # passaram — e o mesmo diagnóstico, disparado à mão logo depois
      # contra a MESMA produção, passou.
      #
      # A causa não é a espera curta: é a PRIMEIRA visita a um Worker
      # recém-publicado, que sobe frio. Esticar o cronômetro só empurra o
      # problema, e já foi esticado duas vezes. Uma segunda tentativa
      # ataca o que realmente acontece — na segunda visita o Worker já
      # está quente.
      #
      # A verificação continua valendo: se a interface estiver mesmo
      # quebrada, as duas tentativas falham e o deploy fica vermelho. O
      # que deixa de acontecer é o alarme falso, que ensina a ignorar o
      # sinal — pior do que não ter sinal nenhum.
      - name: Confirmar interface em navegador real
        shell: bash
        env:
          DIAGNOSTIC_URL: https://beta-gestao-365.scolarisamuel.workers.dev/
          DIAGNOSTIC_WAIT_MS: "90000"
        run: |
          npm run diagnose:live && exit 0
          echo "Primeira tentativa falhou. O Worker pode ter subido frio; repetindo uma vez." >&2
          sleep 20
          npm run diagnose:live

      - name: Confirmar frota em desktop largo
        shell: bash
        env:
          DIAGNOSTIC_URL: https://beta-gestao-365.scolarisamuel.workers.dev/
          DIAGNOSTIC_WAIT_MS: "90000"
        run: |
          node scripts/live-fleet-wide-diagnostic.mjs && exit 0
          echo "Primeira tentativa falhou. Repetindo uma vez." >&2
          sleep 20
          node scripts/live-fleet-wide-diagnostic.mjs

      - name: Registrar resumo da publicação
        if: always()
        shell: bash
        run: |
          {
            echo "## Publicação Cloudflare"
            echo "- Evento: ${{ github.event_name }}"
            echo "- Commit esperado: \`$TARGET_SHA\`"
            echo "- Título na Cloudflare: $DEPLOY_MESSAGE"
            echo "- Worker: https://beta-gestao-365.scolarisamuel.workers.dev/"
          } >> "$GITHUB_STEP_SUMMARY"

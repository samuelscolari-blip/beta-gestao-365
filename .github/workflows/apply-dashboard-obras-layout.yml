name: Aplicar painel executivo de obras

on:
  push:
    branches: [apply-dashboard-obras-layout]

permissions:
  contents: write

jobs:
  refactor-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: apply-dashboard-obras-layout
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Adaptar painel executivo de obras
        shell: python
        run: |
          from pathlib import Path

          component_path = Path("app/components/BetaApp.tsx")
          source = component_path.read_text(encoding="utf-8")

          if "construction-capacity-compact" in source:
              raise SystemExit("O painel compacto já foi aplicado.")

          roadmap_marker = '      <section\n        className="construction-stage-roadmap"'
          finance_marker = '      <section\n        className={`construction-project-finance ${'
          decision_marker = '      <div className="construction-decision-grid">'
          capacity_marker = '      <section className="construction-capacity-section">'
          command_marker = '      <section className={`construction-project-command ${riskTone}`}>'
          cost_marker = '        <div\n          className={`construction-cost-to-complete ${'

          for marker in [roadmap_marker, finance_marker, decision_marker, capacity_marker, command_marker, cost_marker]:
              if source.count(marker) != 1:
                  raise SystemExit(f"Marcador inesperado ou duplicado: {marker[:80]}")

          roadmap_start = source.index(roadmap_marker)
          finance_start = source.index(finance_marker, roadmap_start)
          decision_start = source.index(decision_marker, finance_start)
          capacity_start = source.index(capacity_marker)

          roadmap_block = source[roadmap_start:finance_start].rstrip()
          finance_block = source[finance_start:decision_start].rstrip()
          capacity_block = source[capacity_start:roadmap_start].rstrip()

          compact_capacity = '''      <section className="construction-capacity-section construction-capacity-compact">
        <header className="construction-capacity-compact-header">
          <div>
            <span className="eyebrow">ÍNDICES DE PRODUÇÃO</span>
            <h3>Capacidade e desempenho da obra</h3>
          </div>
          <details className="construction-index-help">
            <summary aria-label="Entenda o Índice Geral">?</summary>
            <div>
              <strong>Como funciona o Índice Geral</strong>
              <p>
                Nota gerencial ponderada que considera avanço físico, prazo,
                equipe, máquinas, produtividade e orçamento. Não representa
                isoladamente a porcentagem concluída da obra.
              </p>
            </div>
          </details>
        </header>
        <div className="construction-capacity-grid construction-capacity-grid-compact">
          <article className={`construction-kpi-card overall ${overallTone}`}>
            <span><Icon name="dashboard" size={19} /></span>
            <div>
              <small>ÍNDICE GERAL</small>
              <strong>{decimalNumber(overallIndex)}%</strong>
              <p>{overallStatus} • resultado ponderado</p>
            </div>
          </article>
          <article className={`construction-kpi-card ${operationCapacity < 60 ? "negative" : operationCapacity < 90 ? "warning" : "positive"}`}>
            <span><Icon name="works" size={18} /></span>
            <div>
              <small>CAPACIDADE OPERACIONAL</small>
              <strong>{decimalNumber(operationCapacity)}%</strong>
              <p>
                Limitada por {capacityConstraint.label} em {decimalNumber(capacityConstraint.value)}%
              </p>
            </div>
          </article>
          <article className={`construction-kpi-card ${ownWorkforceCapacity < 100 ? "warning" : "positive"}`}>
            <span><Icon name="people" size={18} /></span>
            <div>
              <small>EQUIPE DISPONÍVEL</small>
              <strong>{decimalNumber(ownWorkforceCapacity)}%</strong>
              <p>{ownTeamCount} mobilizados de {requiredOwnTeamCount || "—"}</p>
            </div>
          </article>
          <article className={`construction-kpi-card ${machineAvailability < 100 ? "negative" : "positive"}`}>
            <span><Icon name="assets" size={18} /></span>
            <div>
              <small>MÁQUINAS PRODUZINDO</small>
              <strong>{decimalNumber(machineAvailability)}%</strong>
              <p>{activeMachines} ativas de {machineRows.length} • {unavailableMachines} indisponíveis</p>
            </div>
          </article>
          <article className={`construction-kpi-card ${utilizationPercent < 80 ? "warning" : "positive"}`}>
            <span><Icon name="worklogs" size={18} /></span>
            <div>
              <small>HORAS PRODUTIVAS</small>
              <strong>{decimalNumber(utilizationPercent)}%</strong>
              <p>{decimalNumber(productiveHours)} h produtivas • {decimalNumber(lostHours)} h perdidas</p>
            </div>
          </article>
        </div>
      </section>'''

          source = source.replace(capacity_block, compact_capacity, 1)
          source = source.replace(roadmap_block, "", 1)
          source = source.replace(finance_block, "", 1)
          source = source.replace(command_marker, roadmap_block + "\n\n" + command_marker, 1)

          cost_start = source.index(cost_marker)
          cost_end = source.index('\n      </section>', cost_start)
          cost_block = source[cost_start:cost_end].rstrip()

          compact_cost = '''        <div
          className={`construction-cost-to-complete construction-finance-summary ${
            projectedBudgetVariance > 0 ? "over" : "within"
          }`}
        >
          <header>
            <span><Icon name="expenses" size={19} /></span>
            <div>
              <small>ORÇAMENTO & CUSTOS</small>
              <strong>
                {projectedBudgetVariance > 0
                  ? "Alerta de estouro"
                  : projectBudget > 0
                    ? "Dentro do orçamento"
                    : "Cadastro financeiro incompleto"}
              </strong>
            </div>
          </header>
          <div className="construction-finance-pair">
            <span>
              <small>Orçamento aprovado</small>
              <strong>{currency.format(projectBudget)}</strong>
            </span>
            <span>
              <small>Custo final projetado</small>
              <strong>{currency.format(projectedFinalCost)}</strong>
            </span>
          </div>
          <div className="construction-finance-needed">
            <small>NECESSÁRIO PARA CONCLUIR</small>
            <strong>{currency.format(estimatedCostToComplete)}</strong>
            <span>
              Inclui {currency.format(projectOpenCommitments)} comprometidos e {currency.format(uncommittedCostToComplete)} ainda a contratar ou executar.
            </span>
          </div>
          <footer>
            <span>Custo realizado</span>
            <strong>{currency.format(projectRealizedCost)}</strong>
            <b>
              {projectedBudgetVariance > 0
                ? `${currency.format(projectedBudgetVariance)} acima do orçamento`
                : `${currency.format(Math.abs(projectedBudgetVariance))} de margem prevista`}
            </b>
          </footer>
        </div>'''

          source = source.replace(cost_block, compact_cost, 1)
          component_path.write_text(source, encoding="utf-8")

          css_path = Path("app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Painel executivo compacto de obras V53 */"
          if marker in css:
              raise SystemExit("Os estilos do painel compacto já existem.")

          css += r'''

/* Painel executivo compacto de obras V53 */
.construction-executive-v2 .construction-stage-roadmap {
  margin: 0;
  border-color: #dce5ea;
  background: #fff;
  box-shadow: 0 10px 28px rgba(23, 63, 88, 0.055);
}

.construction-executive-v2 .construction-stage-roadmap > header {
  padding: 19px 21px 14px;
}

.construction-executive-v2 .construction-stage-roadmap > header h3,
.construction-capacity-compact-header h3 {
  margin: 4px 0 0;
  color: #183645;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.construction-executive-v2 .construction-stage-roadmap > header p {
  margin-top: 4px;
  font-size: 10px;
}

.construction-executive-v2 .construction-project-command {
  gap: 15px;
  border-color: #dce5ea;
  background: #f8fafb;
  box-shadow: 0 10px 28px rgba(23, 63, 88, 0.055);
}

.construction-executive-v2 .construction-project-progress,
.construction-executive-v2 .construction-stage-highlight,
.construction-executive-v2 .construction-cost-to-complete {
  border: 1px solid #e0e7eb;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 5px 16px rgba(23, 63, 88, 0.04);
}

.construction-executive-v2 .construction-cost-to-complete.over,
.construction-executive-v2 .construction-cost-to-complete.within {
  border-color: #e0e7eb;
  background: #fff;
}

.construction-finance-summary > header > div > strong {
  margin-top: 4px;
  color: #8f5b0b;
  font-size: 11px;
}

.construction-finance-summary.within > header > div > strong {
  color: #087653;
}

.construction-finance-pair {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 14px;
}

.construction-finance-pair > span {
  display: block;
  min-width: 0;
  padding: 11px 12px;
  border: 1px solid #e5ebee;
  border-radius: 11px;
  background: #f8fafb;
}

.construction-finance-pair small,
.construction-finance-needed small {
  display: block;
  color: #748892;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.055em;
  text-transform: uppercase;
}

.construction-finance-pair strong {
  display: block;
  overflow: hidden;
  margin-top: 5px;
  color: #183f50;
  font-size: 15px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.construction-finance-needed {
  margin-top: 11px;
  padding: 13px 14px;
  border-radius: 12px;
  background: #eef5f7;
}

.construction-finance-needed > strong {
  display: block;
  margin: 5px 0 4px;
  color: #183645;
  font-size: 24px;
  letter-spacing: -0.035em;
}

.construction-finance-needed > span {
  display: block;
  color: #627983;
  font-size: 9px;
  line-height: 1.45;
}

.construction-capacity-section.construction-capacity-compact {
  overflow: visible;
  padding: 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.construction-capacity-compact-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 2px 11px;
}

.construction-index-help {
  position: relative;
  z-index: 4;
}

.construction-index-help > summary {
  display: grid;
  width: 27px;
  height: 27px;
  place-items: center;
  border: 1px solid #d4dee3;
  border-radius: 50%;
  color: #607984;
  background: #eef2f4;
  cursor: pointer;
  font-size: 12px;
  font-weight: 850;
  list-style: none;
}

.construction-index-help > summary::-webkit-details-marker {
  display: none;
}

.construction-index-help > div {
  position: absolute;
  top: 35px;
  right: 0;
  width: min(330px, 82vw);
  padding: 13px 14px;
  border: 1px solid #d9e4e8;
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 14px 34px rgba(23, 63, 88, 0.16);
}

.construction-index-help strong {
  color: #244753;
  font-size: 11px;
}

.construction-index-help p {
  margin: 5px 0 0;
  color: #667d87;
  font-size: 10px;
  line-height: 1.5;
}

.construction-capacity-grid.construction-capacity-grid-compact {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 11px;
}

.construction-capacity-grid-compact .construction-kpi-card {
  display: grid;
  min-height: 116px;
  grid-template-columns: 34px minmax(0, 1fr);
  align-content: start;
  gap: 10px;
  padding: 15px;
  border: 1px solid #e1e8ec;
  border-left: 4px solid #6f91a0;
  border-radius: 13px;
  background: #fff;
  box-shadow: 0 6px 18px rgba(23, 63, 88, 0.045);
}

.construction-capacity-grid-compact .construction-kpi-card.positive {
  border-left-color: #22a06b;
}

.construction-capacity-grid-compact .construction-kpi-card.warning {
  border-left-color: #e3a325;
}

.construction-capacity-grid-compact .construction-kpi-card.negative {
  border-left-color: #d9534f;
}

.construction-capacity-grid-compact .construction-kpi-card.overall {
  border-left-color: #2f77d0;
}

.construction-capacity-grid-compact .construction-kpi-card > span {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 10px;
  color: #426674;
  background: #edf3f5;
}

.construction-capacity-grid-compact .construction-kpi-card small,
.construction-capacity-grid-compact .construction-kpi-card strong,
.construction-capacity-grid-compact .construction-kpi-card p {
  display: block;
}

.construction-capacity-grid-compact .construction-kpi-card small {
  color: #71858f;
  font-size: 8px;
  font-weight: 820;
  letter-spacing: 0.055em;
}

.construction-capacity-grid-compact .construction-kpi-card strong {
  margin-top: 5px;
  color: #183645;
  font-size: 22px;
  letter-spacing: -0.035em;
}

.construction-capacity-grid-compact .construction-kpi-card p {
  margin: 4px 0 0;
  color: #6f838c;
  font-size: 9px;
  line-height: 1.4;
}

@media (max-width: 1180px) {
  .construction-capacity-grid.construction-capacity-grid-compact {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 720px) {
  .construction-capacity-grid.construction-capacity-grid-compact,
  .construction-finance-pair {
    grid-template-columns: 1fr;
  }

  .construction-capacity-compact-header {
    align-items: flex-start;
  }
}
'''
          css_path.write_text(css, encoding="utf-8")

          test_path = Path("tests/construction-dashboard-layout.test.mjs")
          test_path.write_text('''import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import test from "node:test";

const component = await readFile("app/components/BetaApp.tsx", "utf8");
const css = await readFile("app/globals.css", "utf8");

test("construction dashboard uses the compact executive layout", () => {
  const roadmap = component.indexOf('className="construction-stage-roadmap"');
  const command = component.indexOf('className={`construction-project-command');
  assert.ok(roadmap >= 0 && command >= 0 && roadmap < command);
  assert.match(component, /construction-capacity-compact/);
  assert.match(component, /construction-finance-summary/);
  assert.match(component, /projectedFinalCost/);
  assert.match(component, /estimatedCostToComplete/);
  assert.doesNotMatch(component, /className={`construction-project-finance/);
  assert.match(css, /Painel executivo compacto de obras V53/);
  assert.match(css, /border-left: 4px solid/);
});
''', encoding="utf-8")

      - name: Instalar dependências
        run: npm ci

      - name: Compilar versão Cloudflare
        run: npm run build

      - name: Executar testes
        run: node --test tests/*.test.mjs

      - name: Registrar implementação na branch
        run: |
          rm .github/workflows/apply-dashboard-obras-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/BetaApp.tsx app/globals.css tests/construction-dashboard-layout.test.mjs .github/workflows/apply-dashboard-obras-layout.yml
          git commit -m "Refatorar painel executivo de obras"
          git push origin HEAD:apply-dashboard-obras-layout

name: Validar Cloudflare

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Confirmar WebSocket nativo e sintaxe do diagnóstico
        run: |
          node -e "if (typeof WebSocket !== 'function') throw new Error('WebSocket global indisponível')"
          node --check scripts/live-browser-diagnostic.mjs

      - name: Instalar dependências como o Cloudflare
        run: npm ci

      - name: Compilar versão final para Cloudflare
        run: npm run build

      - name: Executar testes
        run: node --test tests/*.test.mjs

name: Finalizar Importador V61

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-v61-server-guard.mjs
      - .github/workflows/apply-v61-server-guard.yml

permissions:
  contents: write

jobs:
  server-guard-build-test:
    if: github.actor != 'beta-gestao-365-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar branch V61
        uses: actions/checkout@v4
        with:
          ref: fix-import-same-value-different-dates
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Aplicar proteção do servidor
        run: node scripts/apply-v61-server-guard.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Worker Cloudflare
        run: npm run build

      - name: Executar todos os testes
        run: node --test tests/*.test.mjs

      - name: Gravar proteção validada
        run: |
          git config user.name "beta-gestao-365-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Bloquear importação fora da lista branca no servidor V61"
          git push origin HEAD:fix-import-same-value-different-dates

name: Apply V52 Integrated Upgrade

on:
  push:
    branches:
      - melhorias-integradas-interface-v52
    paths:
      - scripts/apply-v52-upgrade.mjs
      - .github/workflows/apply-v52-upgrade.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: melhorias-integradas-interface-v52
          fetch-depth: 0

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source migration
        run: node scripts/apply-v52-upgrade.mjs

      - name: Validate patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm run install:ci

      - name: Build and validate application
        run: npm run build

      - name: Commit validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "Aplicar melhorias integradas de interface e validação v52"
          git push origin HEAD:melhorias-integradas-interface-v52

# Workflow activated from the default branch before this trigger.

name: Aplicar Importador Inteligente V61

on:
  pull_request:
    branches:
      - main
    paths:
      - app/lib/import-policy.ts
      - app/lib/spreadsheet-layout.mjs
      - app/lib/spreadsheet-semantic.mjs
      - app/lib/spreadsheet.ts
      - app/lib/import-deduplication.mjs
      - tests/spreadsheet-layout.test.mjs
      - tests/v61-importer.test.mjs
      - scripts/apply-v61-interface.mjs
      - .github/workflows/apply-v61.yml

permissions:
  contents: write

jobs:
  transform-build-test:
    if: github.actor != 'beta-gestao-365-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar branch V61
        uses: actions/checkout@v4
        with:
          ref: fix-import-same-value-different-dates
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Aplicar interface controlada da V61
        run: node scripts/apply-v61-interface.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Worker Cloudflare
        run: npm run build

      - name: Executar todos os testes
        run: node --test tests/*.test.mjs

      - name: Gravar V61 validada na branch
        run: |
          git config user.name "beta-gestao-365-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar Importador Inteligente Controlado V61"
          git push origin HEAD:fix-import-same-value-different-dates

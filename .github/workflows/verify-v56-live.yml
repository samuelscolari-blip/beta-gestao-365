name: Verificar V56 publicada

on:
  push:
    branches:
      - verify-v56-live-published
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-visual-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Confirmar V56 no site oficial
        shell: python
        run: |
          import json
          import shutil
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = "https://beta-gestao-365.scolarisamuel.workers.dev"
          chrome = shutil.which("google-chrome") or shutil.which("google-chrome-stable") or shutil.which("chromium")
          if not chrome:
              raise RuntimeError("Chrome/Chromium não encontrado no runner.")

          options = Options()
          options.binary_location = chrome
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-gpu")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-extensions")
          options.add_argument("--window-size=1700,1100")

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 70)

          def click_sidebar(label):
              return driver.execute_script(
                  """
                  const wanted = arguments[0].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
                  const button = [...document.querySelectorAll('.sidebar nav button')].find((item) =>
                    (item.textContent || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes(wanted)
                  );
                  if (!button) return false;
                  button.click();
                  return true;
                  """,
                  label,
              )

          def state():
              return driver.execute_script(
                  """
                  const dashboard = document.querySelector('.construction-dashboard-v56');
                  const kpiRow = document.querySelector('.construction-kpi-row-v56');
                  const kpis = [...document.querySelectorAll('.construction-kpi-row-v56 > article')];
                  const mainGrid = document.querySelector('.construction-main-grid-v56');
                  const stage = document.querySelector('.construction-stage-card-v56');
                  const budget = document.querySelector('.construction-budget-card-v56');
                  const priority = document.querySelector('.construction-priority-board');
                  const health = document.querySelector('.construction-health-board');
                  const spinner = document.querySelector('.page-area .loading-state');
                  const oldBlock = document.querySelector('.construction-project-command');
                  const style = (el) => el ? getComputedStyle(el) : null;
                  return {
                    dashboard: Boolean(dashboard),
                    spinner: Boolean(spinner),
                    oldBlock: Boolean(oldBlock),
                    kpiCount: kpis.length,
                    kpiDisplay: style(kpiRow)?.display || '',
                    kpiColumns: style(kpiRow)?.gridTemplateColumns || '',
                    kpiValues: kpis.map((item) => item.querySelector(':scope > strong')?.textContent?.trim() || ''),
                    kpiBackgrounds: kpis.map((item) => style(item)?.backgroundColor || ''),
                    mainDisplay: style(mainGrid)?.display || '',
                    mainColumns: style(mainGrid)?.gridTemplateColumns || '',
                    stageTitleSize: style(stage?.querySelector('h3'))?.fontSize || '',
                    budgetValueSize: style(budget?.querySelector('h3'))?.fontSize || '',
                    stageBorder: style(stage)?.borderLeftWidth || '',
                    budgetBorder: style(budget)?.borderLeftWidth || '',
                    priority: Boolean(priority),
                    health: Boolean(health),
                    text: dashboard?.textContent?.replace(/\s+/g, ' ').trim().slice(0, 500) || ''
                  };
                  """
              )

          last = None
          try:
              for attempt in range(1, 21):
                  driver.get(f"{base}/?__v56={int(time.time() * 1000)}")
                  wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, ".sidebar nav button"))
                  wait.until(lambda d: not d.find_elements(By.CSS_SELECTOR, ".page-area .loading-state"))
                  if not click_sidebar("Execução da Obra"):
                      raise RuntimeError("A opção Execução da Obra não foi encontrada.")
                  wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, ".construction-dashboard-v56"))
                  wait.until(lambda d: not d.find_elements(By.CSS_SELECTOR, ".page-area .loading-state"))
                  time.sleep(1)
                  last = state()
                  stage_size = float(last["stageTitleSize"].replace("px", "") or 0)
                  budget_size = float(last["budgetValueSize"].replace("px", "") or 0)
                  published = (
                      last["dashboard"]
                      and not last["spinner"]
                      and not last["oldBlock"]
                      and last["kpiCount"] == 4
                      and last["kpiDisplay"] == "grid"
                      and last["mainDisplay"] == "grid"
                      and all(value for value in last["kpiValues"])
                      and all(color == "rgb(255, 255, 255)" for color in last["kpiBackgrounds"])
                      and stage_size >= 22
                      and budget_size >= 28
                      and last["stageBorder"] == "5px"
                      and last["budgetBorder"] == "5px"
                      and last["priority"]
                      and last["health"]
                  )
                  print(f"Tentativa {attempt}/20: {json.dumps(last, ensure_ascii=False)}")
                  if published:
                      print("V56_PUBLICADA=SIM")
                      print("QUATRO_KPIS=SIM")
                      print("GRID_EXECUTIVO=SIM")
                      print("CORES_E_CONTRASTE=SIM")
                      print("BLOCO_ANTIGO=NAO")
                      print("CARREGAMENTO_INFINITO=NAO")
                      break
                  if attempt == 20:
                      raise RuntimeError(f"A V56 não foi confirmada no site oficial: {last}")
                  time.sleep(15)
          finally:
              driver.quit()

name: Verificar V57 publicada

on:
  push:
    branches:
      - verify-v56-live-published

permissions:
  contents: read

jobs:
  live-visual-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Confirmar identidade visual V57 no site oficial
        shell: python
        run: |
          import json
          import shutil
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          base = "https://beta-gestao-365.scolarisamuel.workers.dev"
          chrome = shutil.which("google-chrome") or shutil.which("google-chrome-stable") or shutil.which("chromium")
          if not chrome:
              raise RuntimeError("Chrome/Chromium não encontrado no runner.")

          options = Options()
          options.binary_location = chrome
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-gpu")
          options.add_argument("--disable-dev-shm-usage")
          options.add_argument("--disable-extensions")
          options.add_argument("--window-size=1700,1200")

          driver = webdriver.Chrome(options=options)
          wait = WebDriverWait(driver, 70)

          def click_sidebar(label):
              return driver.execute_script(
                  """
                  const wanted = arguments[0].normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
                  const button = [...document.querySelectorAll('.sidebar nav button')].find((item) =>
                    (item.textContent || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().includes(wanted)
                  );
                  if (!button) return false;
                  button.click();
                  return true;
                  """,
                  label,
              )

          def state():
              return driver.execute_script(
                  """
                  const pick = (selector) => document.querySelector(selector);
                  const all = (selector) => [...document.querySelectorAll(selector)];
                  const style = (element) => element ? getComputedStyle(element) : null;
                  const dashboard = pick('.construction-dashboard-v56');
                  const kpis = all('.construction-kpi-row-v56 > article');
                  const stage = pick('.construction-stage-card-v56');
                  const budget = pick('.construction-budget-card-v56');
                  const priority = pick('.construction-priority-board');
                  const health = pick('.construction-health-board');
                  const workforce = pick('.construction-workforce-card');
                  const loss = pick('.construction-loss-card');
                  const spinner = pick('.page-area .loading-state');
                  return {
                    dashboard: Boolean(dashboard),
                    spinner: Boolean(spinner),
                    kpiCount: kpis.length,
                    dashboardBackground: style(dashboard)?.backgroundImage || '',
                    dashboardTitleColor: style(pick('.construction-dashboard-heading-v56 h3'))?.color || '',
                    kpiBackgrounds: kpis.map((item) => style(item)?.backgroundImage || ''),
                    kpiValueColors: kpis.map((item) => style(item.querySelector(':scope > strong'))?.color || ''),
                    stageBackground: style(stage)?.backgroundImage || '',
                    stageTitleColor: style(stage?.querySelector('h3'))?.color || '',
                    budgetBackground: style(budget)?.backgroundImage || '',
                    budgetValueColor: style(budget?.querySelector('h3'))?.color || '',
                    priorityBackground: style(priority)?.backgroundImage || '',
                    healthBackground: style(health)?.backgroundImage || '',
                    workforceBackground: style(workforce)?.backgroundImage || '',
                    lossBackground: style(loss)?.backgroundImage || '',
                    workforceTitleColor: style(workforce?.querySelector('h3'))?.color || '',
                    lossTitleColor: style(loss?.querySelector('h3'))?.color || '',
                    text: dashboard?.textContent?.replace(/\s+/g, ' ').trim().slice(0, 360) || ''
                  };
                  """
              )

          last = None
          try:
              for attempt in range(1, 25):
                  driver.get(f"{base}/?__v57={int(time.time() * 1000)}")
                  wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, ".sidebar nav button"))
                  wait.until(lambda d: not d.find_elements(By.CSS_SELECTOR, ".page-area .loading-state"))
                  if not click_sidebar("Execução da Obra"):
                      raise RuntimeError("A opção Execução da Obra não foi encontrada.")
                  wait.until(lambda d: d.find_elements(By.CSS_SELECTOR, ".construction-dashboard-v56"))
                  wait.until(lambda d: not d.find_elements(By.CSS_SELECTOR, ".page-area .loading-state"))
                  time.sleep(1)
                  last = state()
                  gradients = [
                      last["dashboardBackground"],
                      last["stageBackground"],
                      last["budgetBackground"],
                      last["priorityBackground"],
                      last["healthBackground"],
                      last["workforceBackground"],
                      last["lossBackground"],
                  ]
                  white_text = [
                      last["dashboardTitleColor"],
                      last["stageTitleColor"],
                      last["budgetValueColor"],
                      last["workforceTitleColor"],
                      last["lossTitleColor"],
                  ]
                  published = (
                      last["dashboard"]
                      and not last["spinner"]
                      and last["kpiCount"] == 4
                      and all("gradient" in value for value in gradients)
                      and all("gradient" in value for value in last["kpiBackgrounds"])
                      and all(value == "rgb(255, 255, 255)" for value in last["kpiValueColors"])
                      and all(value == "rgb(255, 255, 255)" for value in white_text)
                  )
                  print(f"Tentativa {attempt}/24: {json.dumps(last, ensure_ascii=False)}")
                  if published:
                      print("V57_PUBLICADA=SIM")
                      print("AZUL_EXECUTIVO=SIM")
                      print("QUATRO_KPIS_COM_CONTRASTE=SIM")
                      print("ETAPA_E_ORCAMENTO_ESCURECIDOS=SIM")
                      print("PRIORIDADES_E_LEITURA_UNIFICADAS=SIM")
                      print("OPERACAO_E_PRODUTIVIDADE_UNIFICADAS=SIM")
                      print("CARREGAMENTO_INFINITO=NAO")
                      break
                  if attempt == 24:
                      raise RuntimeError(f"A V57 não foi confirmada no site oficial: {last}")
                  time.sleep(15)
          finally:
              driver.quit()

name: Aplicar V60

on:
  push:
    branches:
      - v60-finance-rh-importer-construction
    paths:
      - scripts/apply-v60.mjs
      - scripts/run-v60-fixed.mjs
      - scripts/prepatch-v60.mjs
      - scripts/postpatch-v60.mjs
      - .github/workflows/apply-v60.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-v60.mjs
      - scripts/run-v60-fixed.mjs
      - scripts/prepatch-v60.mjs
      - scripts/postpatch-v60.mjs
      - .github/workflows/apply-v60.yml

permissions:
  contents: write

jobs:
  transform-build-test:
    if: github.actor != 'beta-gestao-365-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar branch V60
        uses: actions/checkout@v4
        with:
          ref: v60-finance-rh-importer-construction
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Aplicar transformação controlada
        run: |
          node scripts/prepatch-v60.mjs
          node scripts/run-v60-fixed.mjs
          node scripts/postpatch-v60.mjs
          rm -f scripts/prepatch-v60.mjs scripts/postpatch-v60.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Worker Cloudflare
        run: npm run build

      - name: Executar todos os testes
        run: node --test tests/*.test.mjs

      - name: Gravar V60 validada na branch
        run: |
          git config user.name "beta-gestao-365-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Aplicar melhorias financeiras, RH, importação e obra V60"
          git push origin HEAD:v60-finance-rh-importer-construction

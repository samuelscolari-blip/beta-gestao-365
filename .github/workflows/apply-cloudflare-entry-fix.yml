name: Aplicar correção de entrada Cloudflare

on:
  push:
    branches: [cloudflare-deploy]

permissions:
  contents: write

jobs:
  fix-entry:
    if: ${{ !contains(github.event.head_commit.message, '[entry-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cloudflare-deploy

      - name: Ajustar entrada da interface
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/components/SecureBetaAppV52.tsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import "./v52-module-corrections";\n', '')
          text = text.replace('dynamic(() => import("./BetaAppV52"), {', 'dynamic(() => import("./BetaAppV52Ready"), {')
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/apply-cloudflare-entry-fix.yml

      - name: Salvar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/SecureBetaAppV52.tsx .github/workflows/apply-cloudflare-entry-fix.yml
          git commit -m "Corrigir entrada da interface Cloudflare [entry-fix]"
          git push origin HEAD:cloudflare-deploy

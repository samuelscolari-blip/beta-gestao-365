name: Corrigir deduplicação da importação

on:
  pull_request:
    branches:
      - main
    paths:
      - app/lib/import-deduplication.mjs
      - tests/import-deduplication.test.mjs
      - scripts/apply-import-deduplication-fix.mjs
      - .github/workflows/apply-import-deduplication-fix.yml

permissions:
  contents: write

jobs:
  transform-build-test:
    if: github.actor != 'beta-gestao-365-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Baixar branch da correção
        uses: actions/checkout@v4
        with:
          ref: fix-import-deduplication-v60
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Aplicar integração da nova chave
        run: node scripts/apply-import-deduplication-fix.mjs

      - name: Instalar dependências
        run: npm ci

      - name: Compilar Worker Cloudflare
        run: npm run build

      - name: Executar todos os testes
        run: node --test tests/*.test.mjs

      - name: Gravar correção validada
        run: |
          git config user.name "beta-gestao-365-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Evitar falsa duplicidade por valores iguais na importação"
          git push origin HEAD:fix-import-deduplication-v60

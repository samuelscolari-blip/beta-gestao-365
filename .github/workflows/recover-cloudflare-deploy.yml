name: Recuperar publicação Cloudflare

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: beta-gestao-365-recovery
  cancel-in-progress: false

jobs:
  recover-production:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/cloudflare-recovery-v80'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://beta-gestao-365.scolarisamuel.workers.dev/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Baixar exatamente a revisão da recuperação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Confirmar credenciais protegidas
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Instalar dependências travadas
        run: npm ci

      - name: Compilar e executar testes
        run: npm test

      - name: Reconhecer histórico do D1 já existente
        run: node scripts/adopt-d1-migration-history.mjs

      - name: Aplicar migrations aditivas no D1
        run: npm run db:migrate:remote

      - name: Publicar V78 e V79 no Worker de produção
        run: npm run deploy:cloudflare

      - name: Confirmar versão publicada
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            marker="$(curl --silent --show-error --location --max-time 30 'https://beta-gestao-365.scolarisamuel.workers.dev/deployment-version.txt' || true)"
            if [[ "$marker" == *"V79"* ]]; then
              echo "$marker"
              exit 0
            fi
            sleep 5
          done
          echo "O Worker respondeu, mas não apresentou o marcador da V79." >&2
          exit 1
